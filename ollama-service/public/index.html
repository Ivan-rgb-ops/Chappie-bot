<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chapi Bot</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
        }
        body {
            margin: 0; padding: 0;
            background-color: transparent; /* Ideal para hacer la ventana transparente en Electron */
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #orb {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.5);
        }
        #status-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div id="orb"></div>
    <div id="status-text">ESCUCHANDO...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const socket = io();
        const orb = document.getElementById('orb');
        const statusText = document.getElementById('status-text');
        
        let orbTween = null;
        let hablaTimeout = null;

        function stateEscuchando() {
            if (orbTween) orbTween.kill();
            statusText.innerText = "ESCUCHANDO...";
            orbTween = gsap.to(orb, {
                scale: 1, backgroundColor: "#4f46e5", boxShadow: "0 0 30px rgba(79, 70, 229, 0.4)",
                duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut"
            });
        }

        function statePensando() {
            if (orbTween) orbTween.kill();
            statusText.innerText = "PENSANDO...";
            orbTween = gsap.to(orb, {
                scale: 0.85, backgroundColor: "#eab308", boxShadow: "0 0 50px rgba(234, 179, 8, 0.6)",
                duration: 0.4, repeat: -1, yoyo: true, ease: "power2.inOut"
            });
        }

        function stateRespondiendo() {
            if (orbTween) orbTween.kill();
            statusText.innerText = "HABLANDO...";
            orbTween = gsap.to(orb, {
                scale: 1.15, backgroundColor: "#22c55e", boxShadow: "0 0 60px rgba(34, 197, 94, 0.6)",
                duration: 0.15, repeat: -1, yoyo: true, ease: "power1.inOut"
            });
        }

        socket.on('connect', () => stateEscuchando());
        socket.on('bot_escuchando', () => stateEscuchando());
        socket.on('procesando_llama', () => statePensando());
        
        socket.on('mensaje_bot', (data) => {
            stateRespondiendo();
            // Estimamos el tiempo que tarda en hablar para volver a escuchar
            const tiempoHabla = Math.max(2000, (data.text || "").length * 75);
            clearTimeout(hablaTimeout);
            hablaTimeout = setTimeout(() => {
                stateEscuchando();
            }, tiempoHabla);
        });
    </script>
</body>
</html>
